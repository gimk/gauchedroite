name = "leftright"
main = "src/worker.js"
compatibility_date = "2024-01-01"

# Static frontend served from public/ (ASSETS binding is used by the worker for non-API routes)
[assets]
directory = "./public"
binding = "ASSETS"

# Cloudflare D1 Database binding
# For production: run `npx wrangler d1 create leftright-db` and update `database_id` below.
[[d1_databases]]
binding = "DB"
database_name = "leftright-db"
database_id = "leftright-db-preview-id"
